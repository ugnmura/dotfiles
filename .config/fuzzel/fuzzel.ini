[main]
font=Noto Sans:size=14
terminal=alacritty -e
prompt="Apps  "
placeholder=Type an application…
icons-enabled=yes
icon-theme=Papirus-Dark
width=56
lines=10
match-mode=fuzzy
horizontal-pad=28
vertical-pad=20
inner-pad=12
line-height=24
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=15151ff0
text=e8e8f2ff
prompt=cba6f7ff
placeholder=7f849cff
input=e8e8f2ff
match=cba6f7ff
selection=292a3dff
selection-text=ffffffff
selection-match=cba6f7ff
counter=7f849cff
border=cba6f780

[border]
width=1
radius=14

[key-bindings]
delete-line-forward=none
prev=Up Control+p Control+k
next=Down Control+n Control+j
cancel=Escape
