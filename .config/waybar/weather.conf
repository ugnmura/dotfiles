# Leave blank to use wttr.in's approximate IP-based location.
# Set a city if auto-detection is off, for example: WEATHER_LOCATION="Aachen"
WEATHER_LOCATION=""

# Keep the source wallpaper immutable. Weather rendering only writes to ~/.cache.
WEATHER_DYNAMIC_WALLPAPER=1
WEATHER_BASE_WALLPAPER="/home/eugene/.wallpaper/wallpaper.png"
